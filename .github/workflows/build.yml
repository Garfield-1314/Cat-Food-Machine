name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout submodules
        run: |
          # .gitmodules uses SSH URLs; rewrite them to HTTPS so CI can fetch
          # the public submodules without an SSH key.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Read ESP-IDF revision
        id: idf
        run: echo "sha=$(git -C esp32libraries/esp-idf rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore ESP-IDF tools
        uses: actions/cache@v6
        with:
          path: ~/.espressif
          key: esp-idf-tools-${{ runner.os }}-${{ steps.idf.outputs.sha }}
          restore-keys: |
            esp-idf-tools-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('src/sdkconfig', 'src/dependencies.lock') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ESP-IDF tools
        run: |
          cd esp32libraries/esp-idf
          ./install.sh esp32s3

      - name: Build and package firmware
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          . esp32libraries/esp-idf/export.sh
          bash scripts/build_firmware.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: cat-food-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: cat-food-firmware
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${NOTES_FILE}"

          NOTES_ARGS=(--notes-file "${NOTES_FILE}")
          if [[ ! -s "${NOTES_FILE}" ]]; then
            rm -f "${NOTES_FILE}"
            NOTES_ARGS=(--generate-notes)
          fi

          PRERELEASE_ARGS=()
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          ASSETS=(
            dist/bootloader.bin
            dist/partition-table.bin
            dist/cat_food.bin
            dist/cat_food-full.bin
            dist/SHA256SUMS.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating assets."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            if [[ "${NOTES_ARGS[0]}" == "--notes-file" ]]; then
              gh release edit "${TAG}" --title "Cat Food Machine ${TAG}" "${NOTES_ARGS[@]}"
            fi
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --verify-tag \
              --title "Cat Food Machine ${TAG}" \
              "${PRERELEASE_ARGS[@]}" \
              "${NOTES_ARGS[@]}"
          fi

          rm -f "${NOTES_FILE}"
